      - Connections: user/connections.md
      - Sync wizard: user/sync-wizard.md
      - Forwarding: user/forwarding.md
      - Native projects: user/projects.md
      - Session Doctor: user/session-doctor.md
      - Conflicts: user/conflicts.md
      - SSH: user/ssh.md
  - Advanced configuration:
