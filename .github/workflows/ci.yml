name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt ruff pytest
      - name: Run static checks
        run: |
          python -m ruff check .
          python verify_source.py
      - name: Run logic and integration tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests --ignore=tests/test_gui_smoke.py --tb=short
