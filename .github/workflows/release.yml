name: Verified cross-platform release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v9.1.0)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  security:
    name: Release source security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install security and quality tools
        run: python -m pip install uv==0.13.8 -r requirements-quality.txt
      - name: Verify pinned pip exports
        run: python scripts/check_dependency_exports.py
      - name: Audit locked dependency sets
        run: python -m pip_audit -r requirements.txt -r requirements-build.txt -r requirements-quality.txt
      - name: Block distribution until owner selects repository license
        run: python scripts/ci/check_release_license.py
      - name: Check YAML syntax and style
        run: python -m yamllint -s .github/workflows .yamllint
      - name: Check GitHub Actions workflows
        run: |
          bash scripts/ci/install_actionlint.sh "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint/actionlint" -color .github/workflows/*.yml
      - name: Verify synthetic token is caught by release secret scanner
        run: python scripts/ci/verify_secret_detection.py
      - name: Scan tracked files for new secrets
        run: git ls-files -z -- ':!.secrets.baseline' | xargs -0 detect-secrets-hook --baseline .secrets.baseline
  build:
    needs: security
    name: Build and verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    permissions:
      contents: read
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libdbus-1-3 libfontconfig1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0
      - name: Install build and quality dependencies
        run: python -m pip install uv==0.13.8
      - name: Sync locked release environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv sync --locked --group build --group test --group quality
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:GITHUB_WORKSPACE '.venv\Scripts')
      - name: Sync locked release environment (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          uv sync --locked --group build --group test --group quality
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Install pinned Mutagen test CLI (Windows)
        if: runner.os == 'Windows'
        env:
          MUTAGEN_TEST_VERSION: 0.18.1
        shell: pwsh
        run: ./scripts/install-mutagen-test-cli.ps1
      - name: Install pinned Mutagen test CLI (macOS/Linux)
        if: runner.os == 'macOS' || runner.os == 'Linux'
        env:
          MUTAGEN_TEST_VERSION: 0.18.1
        run: bash scripts/install-mutagen-test-cli.sh
      - name: Verify release tag matches application version
        run: python -c "import os,subprocess,sys,tomllib; expected=os.environ['VERSION'].removeprefix('v'); actual=subprocess.check_output([sys.executable,'app.py','--version'],text=True).strip(); declared=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert actual == declared == expected, f'tag version {expected}, app version {actual}, and pyproject version {declared} must match'"
      - name: Run source gates
        run: python scripts/ci/run_static_checks.py
      - name: Run synthetic session model performance canary
        run: python benchmarks/session_table_benchmark.py --output benchmark-results/session-table.json
      - name: Upload release performance canary
        uses: actions/upload-artifact@v7
        with:
          name: mutaui-benchmark-${{ matrix.os }}
          path: benchmark-results/session-table.json
          if-no-files-found: error
          retention-days: 90
      - name: Run isolated test suite
        env:
          MUTAGEN_DATA_DIRECTORY: ${{ runner.temp }}/mutagen-control-release-test-data
        run: python scripts/ci/run_tests.py
      - name: Generate exact-commit release test evidence
        run: python scripts/ci/generate_acceptance_report.py --output test-results/acceptance.md
      - name: Upload release test evidence
        uses: actions/upload-artifact@v7
        with:
          name: mutaui-release-test-evidence-${{ matrix.os }}
          path: |
            test-results/pytest.xml
            test-results/evidence.json
            test-results/acceptance.md
            coverage.xml
          if-no-files-found: error
          retention-days: 90
      - name: Build Windows portable folder
        if: runner.os == 'Windows'
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed --noupx --collect-all paramiko
          --paths src --name MutagenControl --icon assets/mutagencontrol.ico
          --version-file assets/version_info.txt --distpath dist-fast --workpath build-fast app.py
      - name: Build Windows single-file executable
        if: runner.os == 'Windows'
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed --noupx --collect-all paramiko
          --paths src --name MutagenControl --icon assets/mutagencontrol.ico
          --version-file assets/version_info.txt --distpath dist --workpath build app.py
      - name: Verify packaged crash recovery
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/run_crash_recovery_self_test.py --executable "./dist-fast/MutagenControl/MutagenControl.exe"
          python scripts/run_crash_recovery_self_test.py --executable "./dist/MutagenControl.exe"
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --version 6.3.3 --no-progress --yes
          $programFilesX86 = [Environment]::GetFolderPath([Environment+SpecialFolder]::ProgramFilesX86)
          if ([string]::IsNullOrWhiteSpace($programFilesX86)) { $programFilesX86 = ${env:ProgramFiles(x86)} }
          if ([string]::IsNullOrWhiteSpace($programFilesX86)) { $programFilesX86 = 'C:\Program Files (x86)' }
          $compiler = Join-Path $programFilesX86 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { throw 'Inno Setup compiler was not installed.' }
          $version = $env:VERSION.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Release tag must be a stable semantic version: $version" }
          & $compiler "/DMyAppVersion=$version" packaging/windows/MutagenControl.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }

      - name: Build macOS application bundle
        if: runner.os == 'macOS'
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --collect-all paramiko --paths src --name MutagenControl --distpath dist-platform --workpath build-platform app.py
      - name: Patch macOS Info.plist metadata
        if: runner.os == 'macOS'
        run: |
          version="${VERSION#v}"
          python scripts/ci/patch_macos_plist.py dist-platform/MutagenControl.app/Contents/Info.plist "$version"
      - name: Build macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="${VERSION#v}"
          arch="$(uname -m)"
          mkdir -p dist/dmg-root/licenses
          ditto dist-platform/MutagenControl.app dist/dmg-root/MutagenControl.app
          cp LICENSE NOTICE.md dist/dmg-root/
          cp licenses/LGPL-*.txt dist/dmg-root/licenses/
          ln -s /Applications dist/dmg-root/Applications
          for attempt in 1 2 3; do
            if hdiutil create -volname "Mutagen Control" -srcfolder dist/dmg-root -ov -format UDZO "dist/MutagenControl-${version}-macos-${arch}.dmg"; then
              break
            fi
            echo "hdiutil create attempt $attempt failed, retrying in 3 seconds..."
            sleep 3
          done
          rm -rf dist/dmg-root
      - name: Verify mounted macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          release_version="${VERSION#v}"
          arch="$(uname -m)"
          mount="$RUNNER_TEMP/mutaui-dmg"
          mkdir -p "$mount"
          hdiutil attach "dist/MutagenControl-${release_version}-macos-${arch}.dmg" -nobrowse -noverify -mountpoint "$mount"
          for file in LICENSE NOTICE.md licenses/LGPL-3.0.txt licenses/LGPL-2.1.txt; do test -s "$mount/$file"; done
          spctl --assess --type execute --verbose=2 "$mount/MutagenControl.app" || echo "Note: Gatekeeper assessment skipped/failed (expected when unsigned)."
          python scripts/run_self_test.py "$mount/MutagenControl.app/Contents/MacOS/MutagenControl"
          hdiutil detach "$mount" -force || hdiutil detach "$mount" || true
      - name: Build Linux AppImage and deb packages
        if: runner.os == 'Linux'
        env:
          MUTAUI_VERSION: ${{ env.VERSION }}
        run: |
          release_version="${VERSION#v}"
          python -m PyInstaller --noconfirm --clean --onedir --windowed --collect-all paramiko --paths src --name MutagenControl --distpath dist-platform --workpath build-platform app.py
          bash packaging/linux/build-packages.sh dist-platform/MutagenControl dist
          APPIMAGE_EXTRACT_AND_RUN=1 "dist/MutagenControl-${release_version}-linux-x86_64.AppImage" --self-test
          sudo apt-get install -y "./dist/MutagenControl-${release_version}-linux-amd64.deb"
          for file in LICENSE NOTICE.md licenses/LGPL-3.0.txt licenses/LGPL-2.1.txt; do test -s "/usr/share/doc/mutagen-control/$file"; done
          python scripts/run_self_test.py /usr/bin/mutagen-control
      - name: Verify Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/run-self-test.ps1 -Executable "./dist-fast/MutagenControl/MutagenControl.exe" -Label "Fast"
          ./scripts/run-self-test.ps1 -Executable "./dist/MutagenControl.exe" -Label "Single"
      - name: Select and authenticate genuine previous Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $selectionJson = & python scripts/ci/select_upgrade_baseline.py --repo $env:GITHUB_REPOSITORY --current-tag $env:VERSION --allow-missing-prior-installer
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the release history; refusing to skip upgrade acceptance.' }
          $selection = $selectionJson | ConvertFrom-Json
          if ($selection.mode -eq 'initial') {
            Write-Host '::notice::No published older stable release exists. First-release install smoke applies.'
          } elseif ($selection.mode -eq 'upgrade') {
            $baselinePath = Join-Path $env:RUNNER_TEMP 'mutaui-previous-setup.exe'
            Invoke-WebRequest -Uri $selection.url -OutFile $baselinePath -TimeoutSec 180
            if ((Get-Item -LiteralPath $baselinePath).Length -lt 50000) {
              throw 'Previous Windows installer is unexpectedly small.'
            }
            if ($selection.sha256) {
              $observed = (Get-FileHash -Algorithm SHA256 -LiteralPath $baselinePath).Hash.ToLowerInvariant()
              if ($observed -ne $selection.sha256) {
                throw 'Previous installer SHA-256 does not match the authenticated release manifest.'
              }
            }
            "BASELINE_SETUP_PATH=$baselinePath" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
            "BASELINE_RELEASE_TAG=$($selection.tag)" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          } else {
            throw "Unexpected release selection mode: $($selection.mode)"
          }
      - name: Verify Windows install and upgrade data preservation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:VERSION.TrimStart('v')
          $setup = "dist/MutagenControl-$version-windows-x64-setup.exe"
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\Mutagen Control'
          $profileDir = Join-Path $env:APPDATA 'MutagenControl'
          $marker = Join-Path $profileDir 'upgrade-preservation-smoke.marker'
          New-Item -ItemType Directory -Force -Path $profileDir | Out-Null
          Set-Content -LiteralPath $marker -Value 'keep user data across install, upgrade, and uninstall'

          if ($env:BASELINE_SETUP_PATH -and (Test-Path -LiteralPath $env:BASELINE_SETUP_PATH)) {
            Write-Host "Running genuine previous-release upgrade test..."
            $proc = Start-Process -FilePath $env:BASELINE_SETUP_PATH -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "Baseline installer run failed: $($proc.ExitCode)" }
            ./scripts/run-self-test.ps1 -Executable (Join-Path $installDir 'MutagenControl.exe') -Label "Installed-Baseline"
            $proc = Start-Process -FilePath (Convert-Path $setup) -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "Version upgrade run failed: $($proc.ExitCode)" }
            if (-not (Test-Path -LiteralPath $marker)) { throw 'In-place upgrade removed user data.' }
            ./scripts/run-self-test.ps1 -Executable (Join-Path $installDir 'MutagenControl.exe') -Label "Upgraded"
          } else {
            Write-Host "No genuine previous release found; executing initial clean install preservation smoke..."
            if (-not (Test-Path $setup)) { throw "Setup executable not found: $setup" }
            $proc = Start-Process -FilePath (Convert-Path $setup) -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "Clean installer run failed: $($proc.ExitCode)" }
            if (-not (Test-Path -LiteralPath $marker)) { throw 'Install removed pre-existing user data.' }
            ./scripts/run-self-test.ps1 -Executable (Join-Path $installDir 'MutagenControl.exe') -Label "Installed"
          }

          foreach ($legalFile in @('LICENSE', 'NOTICE.md', 'licenses\LGPL-3.0.txt', 'licenses\LGPL-2.1.txt')) {
            if (-not (Test-Path -LiteralPath (Join-Path $installDir $legalFile))) {
              throw "Installed legal file missing: $legalFile"
            }
          }
          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller not found at $uninstaller" }
          $proc = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Uninstaller failed: $($proc.ExitCode)" }
          if (-not (Test-Path -LiteralPath $marker)) { throw 'Uninstall removed user data.' }
      - name: Package Windows release files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:VERSION.TrimStart('v')
          $portable = 'dist-fast/MutagenControl'
          Copy-Item -LiteralPath 'LICENSE','NOTICE.md' -Destination $portable
          $licenseDir = Join-Path $portable 'licenses'
          New-Item -ItemType Directory -Force -Path $licenseDir | Out-Null
          Copy-Item -Path 'licenses/LGPL-*.txt' -Destination $licenseDir
          Compress-Archive -Path './dist-fast/MutagenControl' -DestinationPath "dist/MutagenControl-$env:VERSION-windows-x64-portable.zip"
          Copy-Item './dist/MutagenControl.exe' "dist/MutagenControl-$env:VERSION-windows-x64.exe"
          Remove-Item './dist/MutagenControl.exe' -Force
          Copy-Item 'LICENSE' "dist/MutagenControl-$env:VERSION-windows-x64-LICENSE.txt"
          Copy-Item 'NOTICE.md' "dist/MutagenControl-$env:VERSION-windows-x64-THIRD-PARTY-NOTICES.md"
          Copy-Item 'licenses/LGPL-3.0.txt' "dist/MutagenControl-$env:VERSION-windows-x64-LGPL-3.0.txt"
          Copy-Item 'licenses/LGPL-2.1.txt' "dist/MutagenControl-$env:VERSION-windows-x64-LGPL-2.1.txt"
      - name: Generate Windows package SBOM
        if: runner.os == 'Windows'
        uses: anchore/sbom-action@v0.24.3
        with:
          path: dist-fast/MutagenControl
          format: cyclonedx-json
          output-file: dist/MutagenControl-${{ env.VERSION }}-windows-x64.sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate macOS package SBOM
        if: runner.os == 'macOS'
        uses: anchore/sbom-action@v0.24.3
        with:
          path: dist-platform/MutagenControl.app
          format: cyclonedx-json
          output-file: dist/MutagenControl-${{ env.VERSION }}-macos-${{ runner.arch }}.sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate Linux package SBOM
        if: runner.os == 'Linux'
        uses: anchore/sbom-action@v0.24.3
        with:
          path: dist-platform/MutagenControl
          format: cyclonedx-json
          output-file: dist/MutagenControl-${{ env.VERSION }}-linux-amd64.sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: mutaui-release-package-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: mutaui-release-package-*
          path: release-assets
          merge-multiple: true
      - name: Create release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/write_checksums.py release-assets
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "$RELEASE_TAG" --generate-notes
