[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "build", "build-*", "dist", "dist-*", "dist-fast"]

[tool.ruff.lint]
select = ["E9", "F", "B", "I", "UP", "SIM"]

[tool.coverage.run]
branch = true
source = [
    "app",
    "async_recorder",
    "benchmark",
    "endpoint_inspector",
    "gui_capture",
    "insights",
    "log_stream",
    "monitoring",
    "mutagen_client",
    "performance",
    "server_groups",
    "settings",
    "sync_profiles",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75
